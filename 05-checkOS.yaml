
---
- name: Check operating system
  hosts: local
  connection: local
  gather_facts: yes

  tasks:
    - name: Display message if OS is Red Hat
      ansible.builtin.debug:
        msg: "The operating system is Red Hat"
      when: ansible_facts['distribution'] == "RedHat"

    - name: Display message if OS is not Red Hat
      ansible.builtin.debug:
        msg: "The operating system is not Red Hat"
      when: ansible_facts['distribution'] != "RedHat"
      
